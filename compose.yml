# FeCAWa 2026 — Conteneur Node.js/Express derrière Traefik (réseau externe "proxy")
#
# Toutes les variables proviennent de .env (env_file) :
#   - DOMAIN            → domaine public (ex: don.fecawa-waama.org) utilisé par Traefik
#   - PORT              → port écoute interne (défaut 3000)
#   - FEDAPAY_*         → clés API FedaPay + secret webhook
#   - APP_URL, NODE_ENV → configuration applicative
#
# Aucune modification du compose n'est nécessaire pour changer de domaine
# ou de clé : il suffit de modifier .env et de relancer `docker compose up -d`.

services:
  fecawa:
    build: .
    container_name: fecawa
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Forcer le mode production dans le conteneur (la variable .env peut éventuellement
      # dire 'development' ; on veut toujours du prod derrière Traefik).
      NODE_ENV: production

    volumes:
      # Persistance de la base SQLite (fichier fecawa.db + fichiers WAL/SHM)
      - fecawa_data:/app/data

    networks:
      - proxy

    # Contrôle de santé périodique (Healthcheck - Issue #8)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Plafonds de ressources et descripteurs (Protection OOM & CPU - Issue #8)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M
          cpus: "0.10"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    labels:
      # Activer le service dans Traefik
      - "traefik.enable=true"

      # Route Host sur le domaine (interpolé depuis .env → DOMAIN)
      - "traefik.http.routers.fecawa.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.fecawa.entrypoints=websecure"
      - "traefik.http.routers.fecawa.tls.certresolver=letsencrypt"

      # Service / load-balancer vers le port 3000 (PORT interne)
      - "traefik.http.services.fecawa.loadbalancer.server.port=3000"

      # Redirection HTTP → HTTPS (optionnel, si tu n'as pas de redirect séparé)
      - "traefik.http.routers.fecawa-http.entrypoints=web"
      - "traefik.http.routers.fecawa-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.fecawa-http.service=fecawa"
      - "traefik.http.routers.fecawa-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  # Adminer — interface Web (SQLite) sur fecawadb.hashcode.cloud
  adminer:
    build:
      context: .
      dockerfile: adminer/Dockerfile
    image: fecawa-adminer:latest
    container_name: fecawa-adminer
    restart: unless-stopped

    depends_on:
      - fecawa

    environment:
      # Active les plugins : injection CSS de marque + auto-remplissage de la connexion SQLite
      ADMINER_PLUGINS: fecawa-branding fecawa-sqlite-auto

    volumes:
      # Même volume que l'application : le fichier SQLite est visible dans /app/data
      - fecawa_data:/app/data

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fecawa-adminer.rule=Host(`${ADMINER_DOMAIN}`)"
      - "traefik.http.routers.fecawa-adminer.entrypoints=websecure"
      - "traefik.http.routers.fecawa-adminer.tls.certresolver=letsencrypt"
      - "traefik.http.services.fecawa-adminer.loadbalancer.server.port=8080"
      # Protection par mot de passe (basic-auth Traefik) — hash APR1 de la paire admin:tkSNKqNsKS6o3CZ4
      # (les '$' du hash doivent être doublés '$$' ici ; changer le mot de passe → générer
      #  un hash avec `openssl passwd -apr1` puis doubler les '$')
      - "traefik.http.routers.fecawa-adminer.middlewares=fecawa-adminer-auth"
      - "traefik.http.middlewares.fecawa-adminer-auth.basicauth.users=admin:$$apr1$$f22217$$Awz/P.aqN3mRp3h.XJaDE0"
      - "traefik.http.routers.fecawa-adminer-http.entrypoints=web"
      - "traefik.http.routers.fecawa-adminer-http.rule=Host(`${ADMINER_DOMAIN}`)"
      - "traefik.http.routers.fecawa-adminer-http.service=fecawa-adminer"
      - "traefik.http.routers.fecawa-adminer-http.middlewares=redirect-to-https"

volumes:
  # Volume persistant pour la base SQLite (survit aux redémarrages / rebuilds)
  fecawa_data:

networks:
  # Réseau externe déjà existant sur le VPS (Traefik)
  proxy:
    external: true